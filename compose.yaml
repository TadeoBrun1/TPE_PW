services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpe_pw_test

    ports:
      - "5433:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tpe_pw_test"]
      interval: 2s
      timeout: 2s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tpe_pw_test?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure


volumes:
  postgres_test_data:
